name: Release

# Fully automatic release. Every push to `main` is evaluated: release-version.mjs reads
# the Conventional Commits since the last release and resolves the next version
# (feat -> minor, fix -> patch, `!`/BREAKING -> major). If there's nothing
# release-worthy (only chore/docs/ci, or no new commits) it emits release=false and the
# job skips — no publish, no tag, no commit. Otherwise it tests, builds, publishes to
# npm (provenance), commits the bump + changelog, tags, and creates a GitHub Release.
#
# You never touch the version. To force a specific version, bump package.json higher
# than anything on npm and push — that exact version is published.
on:
  push:
    branches: [main]
  workflow_dispatch: # allow a manual run from the Actions tab too

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version-bump commit + tag, create the release
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release # optional GitHub Environment; scopes the NPM_TOKEN secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true # git-cliff needs prior tags to scope "since last release"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve next version
        id: ver
        run: node scripts/release-version.mjs

      - name: No release needed
        if: steps.ver.outputs.release != 'true'
        run: echo "No release-worthy commits since v${{ steps.ver.outputs.previous }} — skipping." >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck
        if: steps.ver.outputs.release == 'true'
        run: npm run typecheck

      - name: Test (builds via pretest)
        if: steps.ver.outputs.release == 'true'
        run: npm test

      - name: Build
        if: steps.ver.outputs.release == 'true'
        run: npm run build

      # Zero-tolerance on shipped deps: audit only runtime deps, fail on any advisory.
      - name: Security audit
        if: steps.ver.outputs.release == 'true'
        run: npm audit --omit=dev --audit-level=low

      # Changelog from Conventional Commits (git-cliff via npx) — replaces the old
      # scripts/update-changelog.mjs. CHANGELOG.md is the in-repo record; RELEASE_NOTES.md
      # becomes the GitHub Release body (this release's entries only).
      - name: Generate changelog + release notes
        if: steps.ver.outputs.release == 'true'
        run: |
          V="v${{ steps.ver.outputs.version }}"
          npx --yes git-cliff@2 --tag "$V" --output CHANGELOG.md
          npx --yes git-cliff@2 --tag "$V" --unreleased --strip all --output RELEASE_NOTES.md
          echo "=== RELEASE_NOTES.md ===" && cat RELEASE_NOTES.md

      - name: Commit version bump + changelog
        if: steps.ver.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md src/util/Constants.ts
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(release): v${{ steps.ver.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish to npm
        if: steps.ver.outputs.release == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        if: steps.ver.outputs.release == 'true'
        run: |
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md # git-cliff change list; CHANGELOG.md is the in-repo record

      - name: Summary
        if: steps.ver.outputs.release == 'true'
        run: |
          echo "🚀 Published ${{ github.event.repository.name }}@${{ steps.ver.outputs.version }} (previous: ${{ steps.ver.outputs.previous }})" >> "$GITHUB_STEP_SUMMARY"
