name: CI

# Build + test on every push and pull request.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The package supports Node >= 18, but the build tools do not: tsup 9 (and its cac/chokidar)
  # only RUN on Node >= 20.19. So every job installs, typechecks and builds on Node 22, then
  # switches to the matrix version and runs the suite against that build. The matrix tests
  # what consumers run (dist/ on Node 18, 20 and 22), not which Node can run the bundler.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22 (build tools)
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      # --ignore-scripts skips `pretest` (a rebuild, which Node 18 cannot run); the suite
      # itself still runs, against the dist/ built above.
      - name: Test
        run: |
          node --version
          npm test --ignore-scripts

  # The SDK's copy of the server contract (openapi/openapi.json) must be the one the server
  # publishes on the matching branch. Its own job, so a server change shows up as ONE red
  # check that says "run npm run openapi:sync" instead of failing every Node version.
  openapi:
    name: openapi contract is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Compare with the community server's spec
        env:
          # main tracks main; everything else tracks dev, where the server's changes land.
          SERVER_BRANCH: ${{ (github.base_ref || github.ref_name) == 'main' && 'main' || 'dev' }}
        run: |
          OPENAPI_SRC="https://raw.githubusercontent.com/CosmosPay/CosmosPay-Community-Server/${SERVER_BRANCH}/openapi/openapi.json" node scripts/sync-openapi.mjs --check
